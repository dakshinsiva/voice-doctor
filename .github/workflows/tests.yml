name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run script tests
        run: python -m unittest discover tests -v
      - name: Run the checks on the examples
        run: |
          python skills/voice-doctor/scripts/audit_config.py examples/cod-confirmation/agent.json
          python skills/voice-doctor/scripts/lint_prompt.py --agent-json examples/appointment-reminder/agent.json
          python skills/voice-doctor/scripts/call_stats.py examples/cod-confirmation/executions.json --agent-json examples/cod-confirmation/agent.json
