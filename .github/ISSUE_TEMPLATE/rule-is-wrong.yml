name: A rule is wrong or missing
description: voice-doctor flagged something that's fine, or missed something that broke a call
labels: [rules]
body:
  - type: markdown
    attributes:
      value: "**Redact first.** No API keys, phone numbers, names or addresses."
  - type: input
    id: finding
    attributes:
      label: Finding or rule
      description: The rule id from the output (e.g. endpointing-too-low), or describe what was missed
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Stack
      placeholder: "Bolna, Sarvam saaras:v4 + bulbul:v4-flash, gpt-4.1-mini, Plivo, Hindi"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened on the call
      description: What the caller heard or experienced, and why voice-doctor's advice was wrong
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Redacted prompt, config or transcript snippet
      render: text
  - type: input
    id: source
    attributes:
      label: Source (vendor doc, code line, or "tested on a live call")
